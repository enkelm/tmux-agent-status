# vim:set ft=tmux:
#
# catppuccin module for tmux-agent-status. Source this between the two
# catppuccin.tmux runs in your status config so the option survives
# @catppuccin_reset, then reference #{E:@catppuccin_status_agents} in
# your status-right list.
#
# Values consumed (written by scripts/status-line.sh on every status-interval):
#   @agents_total    integer  — number of non-parked agent sessions
#   @agents_state    string   — idle | working | wait | done | ask
#   @agents_counts   string   — glyph-prefixed text-tag content, zeros hidden,
#                               e.g. "⚡2 ✓1  1"  (working·done·ask)
#   @agents_icon_bg  string   — hex color for the icon-tag (resolved from
#                               the active catppuccin flavor by status-line.sh)
#
# Note: style attributes inside the ternary use SPACE separation, not commas.
# tmux's format parser consumes commas as `#{?...}` branch separators even
# inside `#[...]` style blocks, which silently truncates the rendered output.

set -ogq "@agents_total" "0"
set -ogq "@agents_state" "idle"
set -ogq "@agents_counts" ""
set -ogqF "@agents_icon_bg" "#{E:@thm_mauve}"

# Deferred: the value is stored as a literal format string and re-evaluated
# every time the status bar renders, so colors track live @agents_* options
# without re-sourcing this file.
set -g "@catppuccin_status_agents" "#{?#{==:#{@agents_total},0},,#[fg=#{@agents_icon_bg}]#{@catppuccin_status_left_separator}#[fg=#{E:@thm_crust} bg=#{@agents_icon_bg}]󰚩 #{@catppuccin_status_middle_separator}#[fg=#{E:@thm_fg} bg=#{E:@catppuccin_status_module_text_bg}] #{@agents_counts}#[fg=#{E:@catppuccin_status_module_text_bg}]#{@catppuccin_status_right_separator}#[default]}"
